<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 860 480" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>One paragraph vs 95-line skill across 3 Claude models</title>

  <text x="20" y="28" font-size="17" font-weight="700" fill="#c9d1d9">One paragraph vs 95-line skill: capability cliff</text>
  <text x="20" y="50" font-size="13" fill="#8b949e">Generic ~60-token paragraph (no benchmark-specific hints), prompt caching on, same 5 tasks.</text>

  <rect x="20" y="64" width="12" height="12" rx="2" fill="#4493f8"/><text x="38" y="75" font-size="13" fill="#8b949e">one-paragraph (~60 tokens)</text>
  <rect x="260" y="64" width="12" height="12" rx="2" fill="#2da44e"/><text x="278" y="75" font-size="13" fill="#8b949e">ponytail (95-line SKILL.md)</text>

  <text x="20" y="106" font-size="14" font-weight="600" fill="#c9d1d9">Sum LOC across 5 tasks, per model (lower is leaner)</text>

  <text x="180" y="146" font-size="13" font-weight="600" fill="#8b949e" text-anchor="end">Opus 4.8</text>
  <rect x="190" y="132" width="195" height="14" rx="2" fill="#4493f8"/><text x="391" y="143" font-size="11" fill="#4493f8" font-weight="600">39</text>
  <rect x="190" y="152" width="190" height="14" rx="2" fill="#2da44e"/><text x="386" y="163" font-size="11" fill="#2da44e">38</text>
  <text x="730" y="154" font-size="13" fill="#4493f8" font-weight="600">parity (1.03x)</text>

  <text x="180" y="204" font-size="13" font-weight="600" fill="#8b949e" text-anchor="end">Haiku 4.5</text>
  <rect x="190" y="190" width="390" height="14" rx="2" fill="#4493f8"/><text x="586" y="201" font-size="11" fill="#4493f8">78</text>
  <rect x="190" y="210" width="195" height="14" rx="2" fill="#2da44e"/><text x="391" y="221" font-size="11" fill="#2da44e" font-weight="600">39</text>
  <text x="730" y="212" font-size="13" fill="#d9822b" font-weight="600">2.00x worse</text>

  <text x="180" y="262" font-size="13" font-weight="600" fill="#8b949e" text-anchor="end">Sonnet 4.6</text>
  <rect x="190" y="248" width="495" height="14" rx="2" fill="#4493f8"/><text x="691" y="259" font-size="11" fill="#4493f8">99</text>
  <rect x="190" y="268" width="210" height="14" rx="2" fill="#2da44e"/><text x="406" y="279" font-size="11" fill="#2da44e" font-weight="600">42</text>
  <text x="730" y="270" font-size="13" fill="#d9822b" font-weight="600">2.36x worse</text>

  <line x1="20" y1="304" x2="840" y2="304" stroke="#30363d" stroke-width="1"/>

  <text x="20" y="332" font-size="14" font-weight="600" fill="#c9d1d9">Cost: paragraph wins on every model (15 cells per arm)</text>

  <text x="180" y="368" font-size="13" font-weight="600" fill="#8b949e" text-anchor="end">total cost (USD)</text>
  <rect x="190" y="354" width="156" height="14" rx="2" fill="#4493f8"/><text x="352" y="365" font-size="11" fill="#4493f8" font-weight="600">$0.039</text>
  <rect x="190" y="374" width="266" height="14" rx="2" fill="#2da44e"/><text x="462" y="385" font-size="11" fill="#2da44e">$0.067</text>
  <text x="730" y="376" font-size="13" fill="#4493f8" font-weight="600">-41%</text>

  <line x1="20" y1="408" x2="840" y2="408" stroke="#30363d" stroke-width="1"/>

  <text x="20" y="434" font-size="14" font-weight="600" fill="#c9d1d9">What this means</text>
  <text x="20" y="454" font-size="12" fill="#8b949e">Opus matches the paragraph byte-for-byte. Sub-frontier models need the skill: its 95 lines aren't filler, they're</text>
  <text x="20" y="471" font-size="12" fill="#8b949e">rule redundancy that catches what Sonnet and Haiku ignore when stated once. The skill is production-tier insurance.</text>
</svg>
